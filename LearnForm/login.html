
<html>
<head>
    <meta charset="UTF-8">
    <title>Login System</title>
</head>
<body>
    <h1>Nội dung trang</h1>
    <form action="http://tranduythanh.com/process.html" method="get">
        <table>
            <tr>
                <td><label for="username">Username:</label></td>
                <td><input type="text" name="username" id="username"></td>
            </tr>
            <tr>
                <td><label for="password">Password:</label></td>
                <td><input type="password" name="password" id="password"></td>
            </tr>
            <tr>
                <td>&nbsp;</td>
                <td>
                    <input type="checkbox" name="saveinfor" id="saveinfor">
                    <label for="saveinfor">Save Login Information</label>
                </td>
            </tr>
            <tr>
                <td>&nbsp;</td>
                <td>
                <input type="submit" value="Login">
                <input type="reset" value="Reset">
                <button type ="reset">Reset 2</button>
                <button type ="button" onclick ="this.style.color='red'">Click me</button>
                </td>
            </tr>
        </table>
    </form>
</body>
</html>
